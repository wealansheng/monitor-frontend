# /etc/nginx/conf.d/monitor-frontend.conf
# 工作台静态站 + 同源 API 反代（monitor-backend，127.0.0.1:8080）。
# 访问：http://<域名>/（80）、https://<域名>/（443）、https://<域名>:8888/，三个入口内容一致。
# 部署前替换 server_name、证书路径；`root` 必须指向 deploy-dist.sh 的解压目录。
# 同一端口只能有一个入口：本文件替代 monitor-backend/deploy/nginx.conf。
# 若 443 已被其他站点（如旧 use-vite.conf）占用同一域名，先备份移走那份配置，或删掉 listen 443 这行。
# 注意：80 是明文，工作台的管理令牌会以明文经过网络；优先用 443 / 8888。
server {
    listen 80;
    listen 443 ssl http2;
    listen 8888 ssl http2;
    server_name forum.wealans.top;

    ssl_certificate /etc/letsencrypt/live/forum.wealans.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forum.wealans.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/monitor-frontend/dist;
    index index.html;

    # Source Map 单文件上限默认 30MB，留出余量。
    client_max_body_size 32m;
    client_body_timeout 60s;
    access_log /var/log/nginx/monitor-frontend-access.log;
    error_log /var/log/nginx/monitor-frontend-error.log;

    add_header X-Content-Type-Options nosniff always;
    # SDK 从业务站点跨域上报事件，仍需 CORS。
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
    add_header Access-Control-Max-Age 86400 always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # Source Map 只通过受保护 API 访问，禁止静态下载。
    location = /mapdata { return 404; }
    location ^~ /mapdata/ { return 404; }
    location ~* \.map$ { return 404; }

    # 工作台查询、SDK 上报、录制与 Source Map 上传都走同源 /api/。
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Vite 产物文件名带内容哈希，可以长缓存。
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # index.html 不缓存，发版后立即生效。
    location = /index.html {
        expires -1;
    }

    # HTML5 History 路由回退：/errors、/events/:id 等直接访问不能 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
